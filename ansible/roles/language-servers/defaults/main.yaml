---
# Language servers for the NeoVim native-LSP config. Each tool is installed the
# way it actually ships, which is why there are four mechanisms rather than one:
#
#   pyright               npm      -> asdf's .default-npm-packages
#   ruff                  installer-> ~/.local/bin (standalone, no Python needed)
#   gopls                 go install (no prebuilt binaries are published)
#   lua-language-server   tarball  -> prebuilt for both linux and darwin
#
# Set any of these false to skip that server.
install_ruff: true
install_gopls: true
install_lua_language_server: true

gopls_package: "golang.org/x/tools/gopls@latest"

lua_ls_version: "3.19.1"
lua_ls_install_dir: "{{ ansible_facts['env']['HOME'] }}/.local/share/lua-language-server"
# Upstream publishes darwin and linux builds under the same naming scheme, so
# this needs a name map rather than an os_family branch.
lua_ls_os_map:
  Darwin: darwin
  Linux: linux
lua_ls_arch_map:
  x86_64: x64
  amd64: x64
  aarch64: arm64
  arm64: arm64
