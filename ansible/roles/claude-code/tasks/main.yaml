---
# Install Claude Code and configure language server plugins

- name: Check if claude is already installed
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/claude"
  register: claude_check

- name: Install Claude Code via native installer
  shell: curl -fsSL https://claude.ai/install.sh | bash
  when: not claude_check.stat.exists

- name: Install typescript-lsp plugin
  when: false
  shell: >
    export PATH="{{ ansible_facts['env']['HOME'] }}/.local/bin:$PATH" &&
    claude plugin install typescript-lsp@claude-plugins-official

- name: Install gopls plugin
  when: false
  shell: >
    export PATH="{{ ansible_facts['env']['HOME'] }}/.local/bin:$PATH" &&
    claude plugin install gopls-lsp@claude-plugins-official

- name: Install pyright plugin
  when: false
  shell: >
    export PATH="{{ ansible_facts['env']['HOME'] }}/.local/bin:$PATH" &&
    claude plugin install pyright@claude-plugins-official

- name: Add svelte-lsp from marketplace
  when: false
  shell: >
    export PATH="{{ ansible_facts['env']['HOME'] }}/.local/bin:$PATH" &&
    claude plugin marketplace add RA1NCS/svelte-lsp

- name: Install svelte-lsp plugin
  when: false
  shell: >
    export PATH="{{ ansible_facts['env']['HOME'] }}/.local/bin:$PATH" &&
    claude plugin install svelte-lsp@svelte-lsp
